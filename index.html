<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birja agenti</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1b2420;--mute:#5f6b65;--line:#dfe3df;--brand:#0b6b4f;--brand-ink:#fff;--soft:#e7f2ee;--warn:#8a5a00;--warn-bg:#fdf3dc}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--card:#1a211d;--ink:#e8ede9;--mute:#9aa8a0;--line:#2c3630;--brand:#3fb68b;--brand-ink:#08130e;--soft:#1f2f28;--warn:#f0c674;--warn-bg:#352a12}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header div{max-width:820px;margin:auto}
h1{font-size:18px;margin:0}
header p{margin:2px 0 0;color:var(--mute);font-size:14px}
main{flex:1;overflow-y:auto;padding:16px}
#log{max-width:820px;margin:auto;display:flex;flex-direction:column;gap:14px}
.q{align-self:flex-end;background:var(--brand);color:var(--brand-ink);padding:9px 13px;border-radius:14px 14px 3px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.a{background:var(--card);border:1px solid var(--line);padding:12px 14px;border-radius:14px 14px 14px 3px;overflow-wrap:anywhere}
.txt{white-space:pre-wrap}
.badge{display:inline-block;font-size:13px;padding:1px 8px;border-radius:99px;margin-top:9px;background:var(--soft);color:var(--brand)}
.badge.w{background:var(--warn-bg);color:var(--warn)}
.meta{color:var(--mute);font-size:13px;margin-left:8px}
details{margin-top:8px;font-size:14px}
summary{cursor:pointer;color:var(--mute)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto;font-size:13px;margin:6px 0;white-space:pre-wrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;margin:6px 0}
th,td{border:1px solid var(--line);padding:3px 7px;text-align:left;white-space:nowrap}
#ex{display:flex;flex-wrap:wrap;gap:8px}
#ex button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font:inherit;font-size:14px;cursor:pointer;text-align:left}
#ex button:hover{border-color:var(--brand)}
footer{padding:12px 16px;border-top:1px solid var(--line);background:var(--card)}
form{max-width:820px;margin:auto;display:flex;gap:8px}
textarea{flex:1;min-width:0;resize:none;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button.send{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.send:disabled{opacity:.55;cursor:wait}
@media (max-width:520px),(max-height:560px){header{padding:8px 16px}h1{font-size:15px}header p{display:none}footer{padding:8px 16px}textarea{font-size:16px}}
</style>
</head>
<body>
<header><div>
  <h1>Birja bitimlari agenti · Агент по сделкам биржи</h1>
  <p>Faqat reyestr ma'lumotlariga tayanib javob beradi · Отвечает только по данным реестра (03.01.2022 – 30.10.2026)</p>
</div></header>
<main id="scroll"><div id="log">
  <div id="ex"></div>
</div></main>
<footer><form id="f">
  <textarea id="i" rows="2" maxlength="1000" placeholder="Savol · Вопрос" aria-label="Savol / Вопрос"></textarea>
  <button class="send" id="b">Yuborish</button>
</form></footer>
<script>
const EX=["2025-yilda eng ko'p sotilgan tovar qaysi?","Какой средний курс доллара был в 2024 году?","Сколько сделок было аннулировано в 2023 году?","Samarqand viloyatida 2026-yilda sement savdosi hajmi qancha?"];
const log=document.getElementById('log'),ex=document.getElementById('ex'),inp=document.getElementById('i'),btn=document.getElementById('b'),sc=document.getElementById('scroll');
EX.forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>send(t);ex.appendChild(b)});
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const LABEL={verified:["✓ Ma'lumot bilan tekshirildi · Проверено по данным",""],no_data:["Ma'lumotda javob yo'q · В данных ответа нет","w"],unverified:["Tasdiqlanmadi · Не подтверждено","w"],error:["Xizmat xatosi · Ошибка сервиса","w"]};
function table(r){const w=el('div','tw'),t=el('table'),h=el('tr');r.columns.forEach(c=>h.appendChild(el('th',null,c)));t.appendChild(h);
 r.rows.slice(0,20).forEach(row=>{const tr=el('tr');row.forEach(v=>tr.appendChild(el('td',null,v==null?'':String(v))));t.appendChild(tr)});w.appendChild(t);return w}
function rich(t){const e=el('div','txt');t.replace(/`/g,'').split('**').forEach((p,i)=>e.appendChild(i%2?el('b',null,p):document.createTextNode(p)));return e}
function render(box,d){box.textContent='';box.appendChild(rich(d.answer));
 const [l,c]=LABEL[d.status]||LABEL.error;box.appendChild(el('span','badge '+c,l));box.appendChild(el('span','meta',d.seconds+' s'));
 const st=(d.steps||[]);if(st.length){const det=el('details');det.open=d.status==='verified';det.appendChild(el('summary',null,"Javob asosi · На чём основан ответ ("+st.length+")"));
  st.forEach(s=>{if(s.tool==='run_sql'){det.appendChild(el('pre',null,s.args.sql));if(s.result.rows&&s.result.rows.length)det.appendChild(table(s.result));else det.appendChild(el('div',null,s.result.error||"0 qator / 0 строк"))}
   else{det.appendChild(el('pre',null,'find_entity: '+s.args.name+'\n'+(s.result.matches||[]).map(m=>m.name+' · '+(m.inn||'')).join('\n')||'—'))}});box.appendChild(det)}}
async function send(t){t=(t||'').trim();if(!t||btn.disabled)return;ex.remove();log.appendChild(el('div','q',t));const a=el('div','a','…');log.appendChild(a);inp.value='';btn.disabled=true;sc.scrollTop=sc.scrollHeight;
 try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:t})});if(!r.ok)throw 0;render(a,await r.json())}
 catch(e){a.textContent="Tarmoq xatosi, qayta urinib ko'ring · Ошибка сети, попробуйте ещё раз"}
 btn.disabled=false;inp.focus();a.scrollIntoView({block:'start',behavior:'smooth'})}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send(inp.value)};
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(inp.value)}};
</script>
</body>
</html>
